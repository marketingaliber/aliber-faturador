# Publica automaticamente uma versão nova sempre que VERSAO (em faturador.py) mudar.
# O GitHub compila o .exe no Windows e publica junto com o versao.json que o atualizador lê.
name: Publicar versao
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  teste:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Testar leitura de tela
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python testes/teste_ocr.py
          python testes/teste_localizador.py
  build:
    needs: teste
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Ler versao
        id: v
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = Select-String -Path faturador.py -Pattern '^VERSAO = "([0-9.]+)"'
          $v = $m.Matches[0].Groups[1].Value
          "versao=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "existe=1" >> $env:GITHUB_OUTPUT; Write-Host "v$v ja publicada, nada a fazer" }
          else { "existe=0" >> $env:GITHUB_OUTPUT; Write-Host "Publicando v$v" }
          exit 0
      - uses: actions/setup-python@v5
        if: steps.v.outputs.existe == '0'
        with:
          python-version: "3.13"
      - name: Compilar
        if: steps.v.outputs.existe == '0'
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python gerar_icone.py
          python -m PyInstaller --noconfirm --onefile --windowed --name AliberFaturador --icon aliber.ico --add-data "aliber.ico;." --collect-all winrt faturador.py
          $p = Start-Process dist/AliberFaturador.exe -ArgumentList "--teste-ocr" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error::Autoteste do .exe falhou com codigo $($p.ExitCode)"; throw "Autoteste do .exe falhou (codigo $($p.ExitCode): 1 = leitura de texto, 2 = foto da tela/componentes)" }
          Write-Host "Autoteste do .exe: leitura de tela OK"
          # reabertura como o atualizador faz: a copia reaberta precisa funcionar inteira
          $res = Join-Path $PWD "reinicio.txt"
          Remove-Item $res -ErrorAction SilentlyContinue
          Start-Process dist/AliberFaturador.exe -ArgumentList "--teste-reinicio=$res"
          $t = 0
          while (-not (Test-Path $res) -and $t -lt 120) { Start-Sleep 3; $t += 3 }
          $janelas = (Get-Process AliberFaturador -ErrorAction SilentlyContinue | ForEach-Object { "[$($_.Id)] '$($_.MainWindowTitle)'" }) -join "; "
          Get-Process AliberFaturador -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path $res)) { Write-Host "::error::Reabertura: copia nao respondeu em 120s. Processos/janelas: $janelas"; exit 1 }
          $c = (Get-Content $res -Raw).Trim()
          if ($c -ne "0") { Write-Host "::error::Reabertura: autoteste da copia reaberta retornou $c. Janelas: $janelas"; exit 1 }
          Write-Host "Teste de reabertura (atualizador): OK"
          # abertura normal: a janela precisa abrir e continuar aberta
          Start-Process dist/AliberFaturador.exe
          Start-Sleep 15
          $procs = @(Get-Process AliberFaturador -ErrorAction SilentlyContinue)
          $vivo = $procs.Count -gt 0
          $titulo = ($procs | Where-Object { $_.MainWindowTitle } | Select-Object -First 1).MainWindowTitle
          $procs | Stop-Process -Force
          if (-not $vivo -or $titulo -notlike "Aliber Faturador*") { Write-Host "::error::Abertura normal falhou (aberto=$vivo, janela='$titulo')"; exit 1 }
          Write-Host "Abertura normal: OK ($titulo)"
          $v = "${{ steps.v.outputs.versao }}"
          $notas = (Get-Content NOVIDADES.txt -Raw -ErrorAction SilentlyContinue)
          $url = "https://github.com/${{ github.repository }}/releases/download/v$v/AliberFaturador.exe"
          @{ versao = $v; url = $url; notas = "$notas".Trim() } | ConvertTo-Json | Set-Content -Encoding utf8 dist/versao.json
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.existe == '0' && github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.v.outputs.versao }}
          target_commitish: ${{ github.sha }}
          name: Aliber Faturador ${{ steps.v.outputs.versao }}
          body_path: NOVIDADES.txt
          make_latest: true
          files: |
            dist/AliberFaturador.exe
            dist/versao.json
