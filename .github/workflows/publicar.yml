# Publica uma versão nova: basta criar uma tag v1.2, v1.3 ...
# O GitHub compila o .exe no Windows e publica junto com o versao.json que o atualizador lê.
name: Publicar versao
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Conferir versao
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if (-not (Select-String -Path faturador.py -Pattern "VERSAO = `"$v`"" -Quiet)) { throw "VERSAO em faturador.py diferente da tag $v" }
      - name: Compilar
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python gerar_icone.py
          python -m PyInstaller --noconfirm --onefile --windowed --name AliberFaturador --icon aliber.ico --add-data "aliber.ico;." faturador.py
          $v = "${{ github.ref_name }}".TrimStart("v")
          $notas = (Get-Content NOVIDADES.txt -Raw -ErrorAction SilentlyContinue)
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AliberFaturador.exe"
          @{ versao = $v; url = $url; notas = "$notas".Trim() } | ConvertTo-Json | Set-Content -Encoding utf8 dist/versao.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AliberFaturador.exe
            dist/versao.json
